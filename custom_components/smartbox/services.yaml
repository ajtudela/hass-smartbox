# Service definitions for the Smartbox integration

set_boost_mode:
  name: Set boost mode
  description: >-
    Activates or deactivates a full-boost mode on a climate entity. This is
    the app's /boost_mode path (boost_config 3); the boost temperature and
    duration numbers remain the defaults used by the Boost preset.
  target:
    entity:
      integration: smartbox
      domain: climate
  fields:
    active:
      name: Active
      description: Activate the mode (true) or deactivate the running mode (false).
      default: true
      selector:
        boolean:
    mode:
      name: Mode
      description: >-
        Boost mode to activate: temp_and_time, max_temp_fixed_time,
        advanced_slot, or runback. Required when active is true.
      selector:
        select:
          options:
            - temp_and_time
            - max_temp_fixed_time
            - advanced_slot
            - runback
    temperature:
      name: Temperature
      description: >-
        Target temperature in the node's own unit. Used by temp_and_time and
        runback; omitted leaves the device's value unchanged.
      selector:
        number:
          min: 5
          max: 86
          step: 0.5
    duration:
      name: Duration
      description: >-
        Requested duration in minutes for temp_and_time or runback; omitted
        leaves the device's value unchanged.
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          unit_of_measurement: "min"

set_boost_params:
  name: Set boost parameters
  description: Sets temperature and duration parameters for the boost function.
  target:
    entity:
      integration: smartbox
      domain: number
  fields:
    # area_id:
    #   example: living_room
    #   selector:
    #     area:
    #       device:
    #         - integration: smartbox
    #       multiple: true
    # device_id:
    #   example: "8f4219cfa57e23f6f669c4616c2205e2"
    #   selector:
    #     device:
    #       filter:
    #         - integration: smartbox
    #       multiple: true
    # entity_id:
    #   example: sensor.living_room_temperature
    #   selector:
    #     entity:
    #       filter:
    #         - integration: smartbox
    #       multiple: true
    temperature:
      name: Temperature
      description: >-
        The target temperature to set during boost mode, in the target
        entity's unit (5-30 °C, or 41-86 °F).
      selector:
        number:
          min: 5
          max: 86
          step: 0.5
    duration:
      name: Duration
      description: The duration of boost mode in minutes.
      selector:
        number:
          min: 60
          max: 1440
          step: 60
          unit_of_measurement: "min"

set_schedule:
  name: Set schedule
  description: >-
    Sets (part of) the heater's own weekly schedule. Keys are the days
    "0".."6" (Sunday..Saturday); each value is the list of hourly profile
    slots (0=frost, 1=eco, 2=comfort). Omitted days keep their current
    programme.
  target:
    entity:
      integration: smartbox
      domain: sensor
  fields:
    schedule:
      name: Schedule
      description: >-
        Day-keyed profile slots, e.g. day "0": [0, 0, 1, 1, ...], with 24
        entries per day (48 where the heater supports half-hourly slots).
      required: true
      selector:
        object:

set_schedule_resolution:
  name: Set schedule resolution
  description: >-
    Switches a heater schedule editor between hourly (24 slots/day) and
    half-hourly (48 slots/day) programme resolution. This writes the setup
    keys the vendor app uses; it does not rewrite the programme itself.
  target:
    entity:
      integration: smartbox
      domain: sensor
  fields:
    resolution:
      name: Resolution
      description: "0 = hourly (24 slots), 1 = half-hourly (48 slots)."
      required: true
      selector:
        select:
          options:
            - "0"
            - "1"

set_charging_schedule:
  name: Set storage charging schedule
  description: >-
    Sets the storage heater's charging days and valley slots. Omitted fields
    keep their current values.
  target:
    entity:
      integration: smartbox
      domain: sensor
  fields:
    active_days:
      name: Active days
      description: Seven booleans, Sunday-first.
      selector:
        object:
    slot_1:
      name: Valley 1
      description: Start/end minute of day; 0/0 disables the slot.
      selector:
        object:
    slot_2:
      name: Valley 2
      description: Start/end minute of day; 0/0 disables the slot.
      selector:
        object:

set_thermostat_schedule:
  name: Set thermostat schedule
  description: >-
    Sets the thermostat's day-keyed minute/temperature programme. m is the
    segment end minute (0..1440); t is the temperature in the node's unit.
  target:
    entity:
      integration: smartbox
      domain: sensor
  fields:
    schedule:
      name: Schedule
      description: >-
        All seven day keys; each value is a list of minute/temperature segments, e.g. day 0 with m=360, t=19.0.
      required: true
      selector:
        object:
